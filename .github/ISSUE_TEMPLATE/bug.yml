name: 脱敏的软件问题反馈
description: 提供复现步骤，不上传私人资料或完整学习备份。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "公开 Issue 请勿包含个人资料、私人路径、访问码、令牌、真实学生数据或完整学习备份。"
  - type: input
    id: version
    attributes:
      label: 发布修订与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 可复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏截图或必要日志片段
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 已移除个人敏感资料、私人路径、令牌与真实学习记录。
          required: true
